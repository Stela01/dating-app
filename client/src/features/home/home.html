@if (!registerMode()) {
  <div class="container py-5">
    <div class="row justify-content-center text-center">
      <div class="col-md-8 col-lg-6">
        <i class="bi bi-people-fill text-primary" style="font-size: 8rem;"></i>
        <h1 class="display-4 fw-bold mt-3">Find your match</h1>
        <p class="lead text-muted mb-4">Come on in... all you need to do is sign up</p>
        <div class="d-flex justify-content-center gap-3">
          <button (click)="showRegister(true)" class="btn btn-primary btn-lg">Register</button>
          <button class="btn btn-outline-secondary btn-lg">Learn more</button>
        </div>
      </div>
    </div>
  </div>
} @else {
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <app-register (cancelRegister)="showRegister($event)" />
      </div>
    </div>
  </div>
}
