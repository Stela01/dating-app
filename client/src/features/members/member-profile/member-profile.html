@if (member(); as member) {
  <div class="d-flex flex-column gap-3">
    <div class="d-flex gap-3">
      <span class="fw-semibold">Member since:</span>
      <span>{{member.created | date: 'longDate'}}</span>
    </div>
    <div class="d-flex gap-3">
      <span class="fw-semibold">Last active:</span>
      <span>{{member.lastActive | date: 'dd. MMM yyyy h:mm a'}}</span>
    </div>
    <h3 class="fs-5 fw-semibold text-primary">About {{member.userName}}</h3>
    <div>{{member.description}}</div>
  </div>
}
