@if (memberService.member(); as member) {
  <div class="d-flex flex-column gap-2">
    <div class="d-flex gap-2">
      <span class="fw-semibold">Member since:</span>
      <span>{{member.created | date: 'longDate'}}</span>
    </div>
    <div class="d-flex gap-2">
      <span class="fw-semibold">Last active:</span>
      <span>{{member.lastActive | date: 'dd. MMM yyyy h:mm a'}}</span>
    </div>
    <h3 class="fs-5 fw-semibold text-primary">About {{member.userName}}</h3>
    @if (memberService.editMode()) {
      <form #editForm="ngForm" (ngSubmit)="updateProfile()" class="d-flex flex-column w-100 gap-2">
        <div class="form-floating">
          <input class="form-control" name="displayName" [(ngModel)]="editableMember.userName" placeholder="Display name">
          <label>Display Name</label>
        </div>
        <div class="form-floating mt-3">
          <textarea class="form-control" name="description" [(ngModel)]="editableMember.description" placeholder="Description" style="height: 150px"></textarea>
          <label>Description</label>
        </div>
        <div class="form-floating mt-3">
          <input class="form-control" name="city" [(ngModel)]="editableMember.city" placeholder="City">
          <label>City</label>
        </div>
        <div class="form-floating mt-3">
          <input class="form-control" name="county" [(ngModel)]="editableMember.country" placeholder="Country">
          <label>Country</label>
          <div class="d-flex justify-content-end mt-2">
            <button [disabled]="!editForm.dirty" type="submit" class="btn btn-success">Submit</button>
          </div>
        </div>
      </form>
    } @else {
      <div>{{member.description}}</div>
    }
  </div>
}
