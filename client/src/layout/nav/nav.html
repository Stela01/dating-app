<nav class="navbar navbar-expand-md navbar-dark bg-primary">
  <div class="container-fluid px-4">

    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/"
       routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <i class="bi bi-people-fill fs-4"></i>
      <span class="fw-bold text-uppercase">Dating App</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNav" aria-controls="mainNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-md-0">
        @if (accountService.currentUser()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/members" routerLinkActive="active"
              [routerLinkActiveOptions]="{exact: true}">Matches</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/lists" routerLinkActive="active">Lists</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/messages" routerLinkActive="active">Messages</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/errors" routerLinkActive="active">Errors</a>
          </li>
          @if (busyService.busyRequestCount() > 0) {
            <li class="nav-item d-flex align-items-center ms-2">
              <div class="spinner-border spinner-border-sm text-light" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </li>
          }
        }
      </ul>

      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-light btn-sm" (click)="themeService.toggle()" title="Toggle theme">
          @if (themeService.theme() === 'light') {
            <i class="bi bi-moon-fill"></i>
          } @else {
            <i class="bi bi-sun-fill"></i>
          }
        </button>
        @if (accountService.currentUser(); as user) {
          <div class="dropdown">
            <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center gap-2"
                    type="button" data-bs-toggle="dropdown">
              <img [src]="user?.imageUrl || '/user.png'" alt="avatar" class="rounded-circle" width="32" height="32">
              <span>{{ user.userName }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" routerLink="/members/{{user.id}}">Edit profile</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" (click)="logout()">Logout</a></li>
            </ul>
          </div>
        } @else {
          <form #loginForm="ngForm" (ngSubmit)="login()" class="d-flex gap-2">
            <input
              [(ngModel)]="creds.email"
              name="email"
              type="text"
              class="form-control"
              placeholder="Email" />
            <input
              [(ngModel)]="creds.password"
              name="password"
              type="password"
              class="form-control"
              placeholder="Password" />
            <button type="submit" class="btn btn-light">Login</button>
          </form>
        }
      </div>
    </div>
  </div>
</nav>
