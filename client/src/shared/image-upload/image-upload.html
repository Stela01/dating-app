<div class="d-flex w-100 gap-4" style="height: 300px;">
  <div class="d-flex align-items-center flex-grow-1">
    <label
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
      [class.border-primary]="isDragging"
      [class.border-4]="isDragging"
      [class.bg-primary]="isDragging"
      [class.bg-opacity-10]="isDragging"
      for="dropzone-file"
      class="d-flex flex-column align-items-center justify-content-center w-100 h-100 rounded"
      style="border: 2px dashed #aaa; cursor: pointer;"
    >
      <p class="mb-2 fs-6">Click to upload or drag and drop</p>
      <input type="file" id="dropzone-file" class="d-none">
    </label>
  </div>

  @if (imageSrc()) {
  <div class="d-flex flex-column gap-3 h-100" style="width: 30%; min-width: 160px;">
    <div class="border border-2 rounded overflow-hidden flex-grow-1">
      <img src="{{imageSrc()}}" alt="image preview"
        class="object-fit-cover w-100 h-100">
    </div>
    <div class="d-flex gap-3">
      <button (click)="onCancel()" class="btn btn-secondary flex-fill">Cancel</button>
      <button
        (click)="onUploadFile()"
        class="btn btn-primary flex-fill"
        [disabled]="loading()"
      >
        @if (loading()) {
          <span class="spinner-border spinner-border-sm"></span>
        }
        Upload image
      </button>
    </div>
  </div>
  }
</div>
