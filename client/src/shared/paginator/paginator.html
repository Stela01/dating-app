<div class="d-flex align-items-center w-100 gap-3 py-3">
  <span>Items per page:</span>
  <select class="form-select" style="width: 80px;" (change)="onPageChange(undefined, $event.target)">
    @for (size of pageSizeOptions(); track $index) {
      <option [value]="size" [selected]="size === pageSize()">{{size}}</option>
    }
  </select>

  <div class="small">
    {{(pageNumber() - 1) * pageSize() + 1}} - {{lastItemIndex()}} of {{totalCount()}}
  </div>

  <div class="d-flex align-items-center gap-2">
    <button
      class="btn btn-outline-secondary rounded-circle"
      [disabled]="pageNumber() === 1"
      (click)="onPageChange(pageNumber() - 1)">
      &larr;
    </button>
    <button
      class="btn btn-outline-secondary rounded-circle"
      [disabled]="pageNumber() >= totalPages()"
      (click)="onPageChange(pageNumber() + 1)">
      &rarr;
    </button>
  </div>
</div>
